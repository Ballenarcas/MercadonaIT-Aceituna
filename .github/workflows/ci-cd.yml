name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Backend: Python / FastAPI Tests & Lints
  # ==========================================
  backend-ci:
    name: Backend CI (FastAPI & Pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit Tests with Pytest
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests -v

  # ==========================================
  # 2. Frontend: React / TypeScript Tests & Build
  # ==========================================
  frontend-ci:
    name: Frontend CI (React, Vitest & Build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Run Frontend Unit Tests (Vitest)
        run: npm test

      - name: Build Production Assets (Vite)
        run: npm run build

      - name: Upload Build Artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7

  # ==========================================
  # 3. Final Pipeline Status
  # ==========================================
  ci-status:
    name: Pipeline Status
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check overall build and test status
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "CI/CD Pipeline failed! Check the jobs above for details."
            exit 1
          fi
          echo "All backend and frontend tests and builds succeeded successfully!"
